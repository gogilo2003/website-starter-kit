<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Image Placeholder</title>
  <desc id="desc">Fallback placeholder image for missing media assets.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3f4f6"/>
      <stop offset="100%" stop-color="#e5e7eb"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#d1d5db" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <g transform="translate(600 360)">
    <rect x="-230" y="-140" width="460" height="280" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="-110" cy="-35" r="34" fill="#cbd5e1"/>
    <path d="M-185 70 L-70 -35 L10 45 L85 -10 L185 70" fill="none" stroke="#94a3b8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-130" y="105" width="260" height="10" rx="5" fill="#e2e8f0"/>
  </g>
  <text x="600" y="585" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="42" fill="#475569" font-weight="700">Image Not Available</text>
  <text x="600" y="628" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#64748b">Placeholder for missing asset</text>
</svg>
